<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tingle Admin</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f6fa;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 20px;
}

header h1 {
  margin: 0 0 6px;
}

.container {
  max-width: 1100px;
  margin: 25px auto;
  padding: 0 15px;
}

.login,
.card,
.panel {
  background: white;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

input,
button,
select,
textarea {
  width: 100%;
  padding: 11px;
  margin-top: 8px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 15px;
}

button {
  cursor: pointer;
  background: #111827;
  color: white;
  border: 0;
}

button:hover {
  opacity: .9;
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
  gap: 15px;
}

.stat {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.stat strong {
  display: block;
  font-size: 28px;
  margin-top: 8px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}

th,
td {
  padding: 10px;
  border-bottom: 1px solid #e5e7eb;
  text-align: left;
  font-size: 14px;
}

.small {
  color: #6b7280;
  font-size: 13px;
}

.error {
  color: #dc2626;
  margin-top: 10px;
}

.success {
  color: #16a34a;
  margin-top: 10px;
}

.hidden {
  display: none;
}

.device-id {
  word-break: break-all;
}
</style>
</head>

<body>

<header>
  <h1>🔐 Tingle Admin</h1>
  <div class="small" style="color:#d1d5db">
    Moderation & service dashboard
  </div>
</header>

<div class="container">

  <div id="loginBox" class="login">
    <h2>Admin Login</h2>

    <input
      id="password"
      type="password"
      placeholder="Admin password"
    >

    <button onclick="login()">Login</button>

    <div id="loginError" class="error"></div>
  </div>

  <div id="dashboard" class="hidden">

    <div class="panel">
      <button onclick="loadAll()">🔄 Refresh Dashboard</button>
    </div>

    <div class="stats">

      <div class="stat">
        Online Sessions
        <strong id="sessions">0</strong>
      </div>

      <div class="stat">
        Waiting Users
        <strong id="waiting">0</strong>
      </div>

      <div class="stat">
        Active Calls
        <strong id="calls">0</strong>
      </div>

      <div class="stat">
        Devices
        <strong id="devicesCount">0</strong>
      </div>

      <div class="stat">
        Reports
        <strong id="reportsCount">0</strong>
      </div>

    </div>

    <div class="panel">
      <h2>❤️ Server Health</h2>
      <pre id="health">Loading...</pre>
    </div>

    <div class="panel">
      <h2>🚨 Reports</h2>

      <div style="overflow:auto">
        <table>
          <thead>
            <tr>
              <th>Category</th>
              <th>Description</th>
              <th>Device</th>
              <th>Date</th>
            </tr>
          </thead>

          <tbody id="reports"></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <h2>👥 Devices</h2>

      <div style="overflow:auto">
        <table>
          <thead>
            <tr>
              <th>Device</th>
              <th>Reports</th>
              <th>Ban</th>
              <th>Reason</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="devices"></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <h2>🔨 Manual Ban</h2>

      <input id="banDevice" placeholder="Device ID">

      <input
        id="banHours"
        type="number"
        value="24"
        min="1"
        max="8760"
        placeholder="Hours"
      >

      <input
        id="banReason"
        placeholder="Reason"
      >

      <button onclick="banDevice()">Ban Device</button>

      <div id="actionMessage"></div>
    </div>

  </div>
</div>

<script>

let token = "";

async function api(url, options = {}) {

  options.headers = {
    ...(options.headers || {}),
    "Authorization": "Bearer " + token,
    "Content-Type": "application/json"
  };

  const response = await fetch(url, options);

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(data.error || "Request failed");
  }

  return data;
}

async function login() {

  const password =
    document.getElementById("password").value;

  if (!password) return;

  token = password;

  try {

    await api("/api/admin/status");

    document.getElementById("loginBox")
      .classList.add("hidden");

    document.getElementById("dashboard")
      .classList.remove("hidden");

    document.getElementById("loginError")
      .textContent = "";

    loadAll();

  } catch (error) {

    token = "";

    document.getElementById("loginError")
      .textContent = "Invalid admin password.";
  }
}

async function loadAll() {

  try {

    const stats =
      await api("/api/admin/stats");

    document.getElementById("sessions")
      .textContent = stats.sessions;

    document.getElementById("waiting")
      .textContent = stats.waiting;

    document.getElementById("calls")
      .textContent = stats.activeCalls;

    document.getElementById("devicesCount")
      .textContent = stats.devices;

    document.getElementById("reportsCount")
      .textContent = stats.reports;

    const health =
      await api("/api/admin/health");

    document.getElementById("health")
      .textContent =
      JSON.stringify(health, null, 2);

    const reports =
      await api("/api/admin/reports");

    const reportsBody =
      document.getElementById("reports");

    reportsBody.innerHTML = "";

    reports.reports.slice().reverse().forEach(report => {

      const row =
        document.createElement("tr");

      row.innerHTML = `
        <td>${escapeHtml(report.category)}</td>
        <td>${escapeHtml(report.description || "")}</td>
        <td class="device-id">
          ${escapeHtml(report.reportedDeviceId || "N/A")}
        </td>
        <td>${escapeHtml(report.at || "")}</td>
      `;

      reportsBody.appendChild(row);
    });

    const devices =
      await api("/api/admin/devices");

    const devicesBody =
      document.getElementById("devices");

    devicesBody.innerHTML = "";

    devices.devices.forEach(device => {

      const banned =
        device.bannedUntil &&
        device.bannedUntil > Date.now();

      const row =
        document.createElement("tr");

      row.innerHTML = `
        <td class="device-id">
          ${escapeHtml(device.deviceId)}
        </td>

        <td>
          ${device.reportsAgainst || 0}
        </td>

        <td>
          ${banned ? "🚫 Banned" : "✅ Active"}
        </td>

        <td>
          ${escapeHtml(device.banReason || "")}
        </td>

        <td>
          ${
            banned
            ? `<button onclick="unbanDevice('${escapeJs(device.deviceId)}')">
                Unban
               </button>`
            : `<button onclick="quickBan('${escapeJs(device.deviceId)}')">
                Ban
               </button>`
          }
        </td>
      `;

      devicesBody.appendChild(row);
    });

  } catch (error) {

    document.getElementById("actionMessage")
      .className = "error";

    document.getElementById("actionMessage")
      .textContent = error.message;
  }
}

async function banDevice() {

  const deviceId =
    document.getElementById("banDevice").value.trim();

  const hours =
    Number(document.getElementById("banHours").value);

  const reason =
    document.getElementById("banReason").value.trim();

  if (!deviceId) {
    showMessage("Enter a device ID.", true);
    return;
  }

  try {

    await api("/api/admin/ban", {
      method: "POST",
      body: JSON.stringify({
        deviceId,
        durationHours: hours,
        reason
      })
    });

    showMessage("Device banned successfully.");

    document.getElementById("banDevice").value = "";

    loadAll();

  } catch (error) {

    showMessage(error.message, true);
  }
}

async function quickBan(deviceId) {

  if (!confirm("Ban this device for 24 hours?")) {
    return;
  }

  try {

    await api("/api/admin/ban", {
      method: "POST",
      body: JSON.stringify({
        deviceId,
        durationHours: 24,
        reason: "Admin moderation"
      })
    });

    loadAll();

  } catch (error) {

    showMessage(error.message, true);
  }
}

async function unbanDevice(deviceId) {

  try {

    await api("/api/admin/unban", {
      method: "POST",
      body: JSON.stringify({
        deviceId
      })
    });

    showMessage("Device unbanned.");

    loadAll();

  } catch (error) {

    showMessage(error.message, true);
  }
}

function showMessage(message, error = false) {

  const el =
    document.getElementById("actionMessage");

  el.textContent = message;

  el.className =
    error ? "error" : "success";
}

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeJs(value) {

  return String(value)
    .replaceAll("\\", "\\\\")
    .replaceAll("'", "\\'");
}

document
  .getElementById("password")
  .addEventListener("keydown", event => {

    if (event.key === "Enter") {
      login();
    }

  });

</script>

</body>
</html>
